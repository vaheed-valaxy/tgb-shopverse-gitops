
name: Test Job

on:
  workflow_dispatch:

env:
  RUNS_ON: shopverse-dev   # ubuntu-latest

jobs:
  set-variables-job:
    runs-on: ubuntu-latest

    steps:
      - name: Set variables
        env:
          AWS_ARN: ${{ env.RUNS_ON == 'ubuntu-latest' && vars.AWS_ARN_12345 || '' }}
        run: |
          echo "AWS_ARN=$AWS_ARN" >> "$GITHUB_ENV"

      - name: Print ARN
        run: |
          echo "AWS_ARN = $AWS_ARN"
