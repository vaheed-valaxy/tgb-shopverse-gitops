name: Reusable - PROD GitOps Helm + Kubernetes Security

on:
  workflow_call:

    inputs:

      component:
        description: "Component name"
        required: true
        type: string

      environment:
        description: "Environment name"
        required: true
        type: string

      chart-path:
        description: "Path to Helm chart"
        required: true
        type: string

      values-file:
        description: "Path to Helm values file"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest
       
      aws-account-id:
        description: "AWS PROD Account ID"
        required: true
        type: string
        
      aws-region:
        description: "AWS PROD Region"
        required: true
        type: string

      aws-ecr-role-arn:
        description: "AWS ECR role for PROD"
        required: false
        type: string
        default: ''

      aws-prod-ecr-repo:
        description: "AWS PROD ECR Repo"
        required: true
        type: string

env:
  TRIVY_VERSION: v0.72.0
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0

  # KYVERNO_VERSION: v1.19.1
  # KYVERNO_ARCHIVE: "kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"

jobs:

  GitOps-Validation:

    name: "${{ inputs.component }} - ${{ inputs.environment }} - Helm + Kubernetes Security"
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      security-events: write
      pull-requests: read
      id-token: write

    steps:

      # ======================================================
      # 1. Checkout GitOps Repository
      # ======================================================

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0


      # ======================================================
      # 2. Setup Helm
      # ======================================================

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build Helm Dependencies
        run: |
          echo "Chart_Path: ${{ inputs.chart-path }}"
          # rm -rf "${{ inputs.environment }}/${{ inputs.component }}/charts"
          
          helm dependency build "${{ inputs.chart-path }}"    #./helm-charts-new/${{ inputs.component }}


      # ======================================================
      # 3. Helm Lint
      # ======================================================
      
      - name: Commit being tested
        run: |
          echo "------------------------------------------"
          echo "Commit being tested"
          echo "------------------------------------------"
          git log -1 --oneline

      - name: Helm Lint
        run: |
          set -euo pipefail

          echo "Component   : ${{ inputs.component }}"
          echo "Chart       : ${{ inputs.chart-path }}"
          echo "Values file : ${{ inputs.values-file }}"

          helm lint \
            "${{ inputs.chart-path }}" \
            -f "${{ inputs.values-file }}"


      # ======================================================
      # 4. Render Helm Templates
      # ======================================================

      - name: Render Helm Manifests
        run: |
          set -euo pipefail

          mkdir -p "rendered/${{ inputs.component }}"

          helm template \
            "${{ inputs.component }}" \
            "${{ inputs.chart-path }}" \
            -f "${{ inputs.values-file }}" \
            > "rendered/${{ inputs.component }}/${{ inputs.component }}.yaml"

          echo "Helm rendering completed."


      # ======================================================
      # 5. Show Rendered Manifests
      # ======================================================

      - name: Show Rendered Kubernetes Manifests
        run: |
          echo "=================================================="
          echo "Rendered Kubernetes Manifests"
          echo "Component: ${{ inputs.component }}"
          echo "=================================================="

          cat \
            "rendered/${{ inputs.component }}/${{ inputs.component }}.yaml"


      # ======================================================
      # 6. Install Kubeconform
      # ======================================================

      - name: Install Kubeconform
        run: |
          set -euo pipefail

          KUBECONFORM_URL="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          echo "Downloading Kubeconform ${KUBECONFORM_VERSION}..."

          curl -fsSL "$KUBECONFORM_URL" -o /tmp/kubeconform.tar.gz
            
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
            
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
            
          kubeconform -v


      # ======================================================
      # 7. Kubeconform
      # ======================================================

      - name: Kubeconform - Kubernetes Schema Validation
        run: |
          set -euo pipefail

          kubeconform \
            -strict \
            -summary \
            -output tap \
            -ignore-missing-schemas \
            "rendered/${{ inputs.component }}/${{ inputs.component }}.yaml"

            # -kubernetes-version "${K8S_VERSION}" 
            # -skip TargetGroupBinding
            # -output text pretty


      # ======================================================
      # 8. Setup Trivy
      # ======================================================

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}


      # ======================================================
      # 9. Trivy Security Scan
      # ======================================================

      - name: Trivy - Kubernetes Manifest Security Scan
        run: |
          set -euo pipefail

          trivy config \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            "rendered/${{ inputs.component }}"


      # ======================================================
      # 10. Generate Trivy SARIF
      # ======================================================

      - name: Generate Trivy SARIF
        if: always()
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output "trivy-k8s-${{ inputs.component }}-${{ inputs.environment }}.sarif" \
            "rendered/${{ inputs.component }}"


      # ======================================================
      # 11. Check SARIF
      # ======================================================

      - name: Check Trivy SARIF
        id: check-sarif
        if: always()
        run: |

          SARIF_FILE="trivy-k8s-${{ inputs.component }}-${{ inputs.environment }}.sarif"

          if [ -s "$SARIF_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ SARIF file exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SARIF file does not exist or is empty."
          fi


      # ======================================================
      # 12. Upload SARIF
      # ======================================================

      - name: Upload Trivy SARIF
        if: always() && steps.check-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-k8s-${{ inputs.component }}-${{ inputs.environment }}.sarif
          category: trivy-k8s-${{ inputs.component }}-${{ inputs.environment }}
          wait-for-processing: true


      # ============================================================
      # 13. Configure AWS credentials using GitHub OIDC
      # ============================================================
      
      - name: Configure AWS credentials
        if: inputs.aws-ecr-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-ecr-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          allowed-account-ids: ${{ inputs.aws-account-id }} # '254405569649'
          

      # ============================================================
      # 14. Verify AWS identity
      # ============================================================
      
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
      
          echo "AWS identity:"
          aws sts get-caller-identity
      
          echo ""
          echo "AWS region:"
          echo "${{ inputs.aws-region }}"


      # ============================================================
      # 15. Verify PROD ECR access
      # ============================================================
      
      - name: Verify PROD ECR access
        shell: bash
        run: |
          set -euo pipefail
      
          echo "Testing access to PROD ECR repository..."
      
          aws ecr describe-repositories \
            --repository-names "${{ inputs.aws-prod-ecr-repo }}" \
            --region "${{ inputs.aws-region }}"
      
          echo "PROD ECR: ${{ inputs.aws-prod-ecr-repo }} access successful."

          
      # ============================================================
      # 16. Install Kyverno CLI
      # ============================================================

      - name: Install Kyverno CLI
        shell: bash
        run: |
          set -euo pipefail
      
          KYVERNO_VERSION="v1.19.1"
          KYVERNO_ARCHIVE="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
      
          curl -fL \
            -o "/tmp/${KYVERNO_ARCHIVE}" \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/${KYVERNO_ARCHIVE}"
      
          tar -xzf \
            "/tmp/${KYVERNO_ARCHIVE}" \
            -C /tmp
      
          sudo install -m 0755 \
            /tmp/kyverno \
            /usr/local/bin/kyverno
      
          kyverno version
          

      # ============================================================
      # Install Cosign
      # ============================================================
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3


      # ============================================================
      # Login to PROD ECR
      # ============================================================

      - name: Login to PROD ECR
        uses: aws-actions/amazon-ecr-login@v2

        
      # ============================================================
      # 17. Kyverno CLI validation + Cosign validation(SBOM)
      # ============================================================
      # Kyverno + Cosign security validation
      #
      # Temporary workaround:
      #
      # Kyverno 1.19.x currently has an issue validating the
      # Cosign SBOM attestation through ImageValidatingPolicy.
      #
      # Therefore:
      #
      #   Kyverno:
      #     - image digest
      #     - ECR registry
      #     - image signature
      #
      #   Cosign:
      #     - SBOM attestation signature
      #     - exact certificate identity
      #     - OIDC issuer
      #     - CycloneDX predicate
      #
      # The production Kyverno SBOM ImageValidatingPolicy remains
      # in kyverno/prod and can be re-enabled once Kyverno fixes
      # the attestation verification issue.
      # ============================================================

      - name: Kyverno + Cosign security validation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kyverno-reports
          mkdir -p kyverno-ci/static
          mkdir -p kyverno-ci/prod

          RESOURCE="rendered/${{ inputs.component }}/${{ inputs.component }}.yaml"
          REPORT="kyverno-reports/${{ inputs.component }}-kyverno-report.yaml"

          echo "=================================================="
          echo "Kyverno + Cosign Security Validation"
          echo "=================================================="
          echo "Environment : ${{ inputs.environment }}"
          echo "Component   : ${{ inputs.component }}"
          echo "Resource    : $RESOURCE"
          echo

          # ----------------------------------------------------------
          # Copy static Kyverno policies
          # ----------------------------------------------------------

          cp kyverno/static/*.yaml kyverno-ci/static/

          # ----------------------------------------------------------
          # Copy production Kyverno policies except the SBOM IVPOL.
          #
          # The SBOM attestation itself is verified separately with
          # Cosign below.
          # ----------------------------------------------------------

          for POLICY in kyverno/prod/*.yaml; do

            if grep -q \
              'name: enforce-main-container-sbom-attestation' \
              "$POLICY"
            then
              echo "Temporarily excluding Kyverno SBOM IVPOL:"
              echo "  $POLICY"
              continue
            fi

            cp "$POLICY" kyverno-ci/prod/

          done

          echo
          echo "=================================================="
          echo "Kyverno Policy Validation"
          echo "=================================================="

          set +e

          kyverno apply \
            kyverno-ci/static \
            kyverno-ci/prod \
            --resource "$RESOURCE" \
            --policy-report \
            2>&1 | tee "$REPORT"

          KYVERNO_EXIT=${PIPESTATUS[0]}

          set -e

          echo
          echo "=================================================="
          echo "Kyverno Policy Report"
          echo "=================================================="

          cat "$REPORT"

          if [[ "$KYVERNO_EXIT" -ne 0 ]]; then
            echo
            echo "::error::Kyverno validation failed with exit code $KYVERNO_EXIT"
            exit "$KYVERNO_EXIT"
          fi

          echo
          echo "Kyverno validation passed."

          # ==========================================================
          # Extract the exact image from the rendered Deployment
          # ==========================================================
          
          DEPLOYMENT_COUNT="$(yq -r 'select(.kind == "Deployment") | .metadata.name' "$RESOURCE" | wc -l)"
          
          if [[ "$DEPLOYMENT_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one Deployment in $RESOURCE, found $DEPLOYMENT_COUNT."
            exit 1
          fi
          
          IMAGE="$(yq -r '
            select(.kind == "Deployment")
            | .spec.template.spec.containers[0].image
          ' "$RESOURCE")"
          
          if [[ -z "$IMAGE" || "$IMAGE" == "null" ]]; then
            echo "::error::Unable to extract main container image from Deployment."
            exit 1
          fi
          
          echo
          echo "=================================================="
          echo "SBOM Attestation Verification"
          echo "=================================================="
          echo "Image:"
          echo "$IMAGE"
          
          # ==========================================================
          # Verify the extracted image is digest-pinned
          # ==========================================================
          
          if [[ ! "$IMAGE" =~ @sha256:[a-fA-F0-9]{64}$ ]]; then
            echo "::error::Extracted image is not pinned to a SHA256 digest:"
            echo "$IMAGE"
            exit 1
          fi
          
          # ==========================================================
          # Verify CycloneDX SBOM attestation directly with Cosign
          # ==========================================================
          
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity \
            'https://github.com/vaheed-valaxy/central-github-actions/.github/workflows/reusable-sbom-attestation.yml@refs/heads/main' \
            --certificate-oidc-issuer \
            'https://token.actions.githubusercontent.com' \
            "$IMAGE" \
            > /tmp/sbom-attestation.json
          
          echo
          echo "Cosign SBOM attestation signature verification passed."

          
      # ============================================================
      # 18. Kyverno Report Upload
      # ============================================================
      
      - name: Upload Kyverno report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-report-k8s-${{ inputs.component }}
          path: kyverno-reports/${{ inputs.component }}-kyverno-report.yaml
          if-no-files-found: warn  #error
          retention-days: 1    
