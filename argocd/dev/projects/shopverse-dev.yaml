apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shopverse-dev
  namespace: argocd

spec:

  # ============================================================
  # Allowed Git repositories
  # ============================================================
  sourceRepos:
    - https://github.com/vaheed-valaxy/tgb-shopverse-gitops.git

  # ============================================================
  # Allowed destinations
  # ============================================================
  destinations:
    - server: https://kubernetes.default.svc
      namespace: shopverse-dev

  # ============================================================
  # Cluster-wide resources this AppProject can manage
  # ============================================================
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: "rbac.authorization.k8s.io"
      kind: Role

    - group: "rbac.authorization.k8s.io"
      kind: RoleBinding

  # ============================================================
  # Namespace-scoped resources this AppProject can manage
  # ============================================================
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # ============================================================
  # AppProject role for GitHub Actions
  # ============================================================
  roles:

    - name: shopverse-gh-actions-dev
      description: GitHub Actions role for syncing Shopverse DEV applications.
      
      policies:

        # Allow GitHub Actions to read the DEV applications
        - p, proj:shopverse-dev:shopverse-gh-actions-dev, applications, get, shopverse-dev/*, allow 

        # Allow GitHub Actions to sync the DEV applications
        - p, proj:shopverse-dev:shopverse-gh-actions-dev, applications, sync, shopverse-dev/*, allow
          
        # -p, proj:<proj_name>:<role_name>, applications, sync, <proj_name>/*, allow
  # ============================================================
  # Description
  # ============================================================
  description: >
    Single AppProject for dev environment of Shopverse application.
    Provides GitOps permissions and allows automated namespace creation.
