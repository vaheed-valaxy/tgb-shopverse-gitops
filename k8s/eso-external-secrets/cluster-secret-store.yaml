apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: shopverse-cluster-secret-store
  labels:
    managed-by: terraform
spec:
  provider:
    aws:
      service: SecretsManager      # AWS Secrets Manager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: kube-system
