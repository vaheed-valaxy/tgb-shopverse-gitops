# ===================================================
#                    BACKEND
# ===================================================

# namespace: shopverse-dev 

# ---------------------------------------------------
# Container
# ---------------------------------------------------
image:
  ecr_registry: 254405569649.dkr.ecr.us-east-1.amazonaws.com
  ecr_repository: shopverse-dev/backend
  tag: v1
  digest: sha256:23964017a0624baabff5dd11368358c6ef0905c5ec62e19cc04fecea347e0af9
containerName: backend
imagePullPolicy: Always
terminationGracePeriodSeconds: 30
# ---------------------------------------------------
# Labels
# ---------------------------------------------------
labels:
  app.kubernetes.io/name: shopverse
  app.kubernetes.io/component: backend
  app.kubernetes.io/env: dev
  app.kubernetes.io/version: 1.0.0
# ---------------------------------------------------
# Deployment
# ---------------------------------------------------
deployment:
  name: backend-deploy
  replicas: 1
# ---------------------------------------------------
# Service
# ---------------------------------------------------
service:
  name: backend-svc
  type: ClusterIP
  port: 8080
  targetPort: 8080
# ---------------------------------------------------
# Pod Annotations
# ---------------------------------------------------
annotations:
  enabled: true
  enable_checksum: true
  checksum_file: configmap.yaml
  values:
    reloader.stakater.com/auto: "true"
# ---------------------------------------------------
# Security Context
# ---------------------------------------------------
podSecurityContext:
  enabled: true
  values:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
containerSecurityContext:
  enabled: true
  values:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
# ---------------------------------------------------
# Configmaps & Secrets
# ---------------------------------------------------
configmap:
  enabled: true
  name: backend-configmap
  values:
    DB_HOST: "shopverse-dev-mysql.ca9aykaigakf.us-east-1.rds.amazonaws.com"
    DB_PORT: "3306"
    DB_NAME: "shopverse"
    FRONTEND_ORIGIN: "*"
secret:
  name: shopverse-dev-mysql-jwt-credentials
  create: false # Creates through ESO    
envFrom:
  enabled: true
  values:
    - configMapRef:
        name: backend-configmap
    - secretRef:
        name: shopverse-dev-mysql-jwt-credentials # Creates through ESO   
# ---------------------------------------------------
# Limits & Requests
# ---------------------------------------------------
resources:
  enabled: true
  values:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
# ---------------------------------------------------
# Healthcheck Probes
# ---------------------------------------------------
startupProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8080
    failureThreshold: 10
    periodSeconds: 10
readinessProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10
livenessProbe:
  enabled: true
  values:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 30
# ---------------------------------------------------
# Autoscaling
# ---------------------------------------------------
autoscaling:
  enabled: false
  values:
    name: backend-hpa
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
# ---------------------------------------------------
# Service Account
# ---------------------------------------------------
serviceAccount:
  create: false
  values:
    name: backend-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/backend-role
# ---------------------------------------------------
# Target Group Binding
# ---------------------------------------------------
targetGroupBinding:
  enabled: true
  name: shopverse-dev-backend-tgb
  values:
    targetType: "ip"
    targetGroupName: shopverse-dev-backend-tg
    # targetGroupARN: "REPLACE_WITH_TERRAFORM_OUTPUT"
    
