githubConfigUrl: "https://github.com/vaheed-valaxy/tgb-shopverse-backend"

githubConfigSecret: "shopverse-gha-arc-token"

runnerScaleSetName: "shopverse-backend-runners"
minRunners: 0
maxRunners: 3

# To provide Docker Daemon for image building
containerMode:
  type: "dind"

# ARC Controller Service Account
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller
    
# ARC Runner Service Account
resourceMeta:
  noPermissionServiceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::254405569649:role/shopverse-dev-gha-arc-runner-role"    # ShopverseDevArcRunnerECRRole
      
# Node Selector & Tolerations
template:
  spec:
#     nodeSelector:
#       workload: ci

#     tolerations:
#       - key: dedicated
#         operator: Equal
#         value: ci
#         effect: NoSchedule

    containers:
      - name: runner
        image: vaheeddockerhub/vaheed-arc-runner-img:v2                
        imagePullPolicy: Always
        command: ["/home/runner/run.sh"]

        # command: ["bash", "/home/runner/run.sh"]               # Working
        # command:                                               # Working
        #   - /home/runner/run.sh

