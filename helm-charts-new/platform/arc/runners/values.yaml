githubConfigUrl: "https://github.com/vaheed-valaxy/tgb-shopverse-gitops"
githubConfigSecret: "shopverse-github-token"

runnerScaleSetName: "shopverse-dev-runners"
minRunners: 1
maxRunners: 3

controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

containerMode:
  type: "dind"
  
# Runner Service Account
noPermissionServiceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::254405569649:role/shopverse-dev-gha-runner-role"    # ShopverseDevArcRunnerECRRole

